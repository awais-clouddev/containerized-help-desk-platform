<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Desk Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div>
            <h1>Help Desk Platform</h1>
            <p>Internal IT support and ticket operations</p>
        </div>
        <span id="api-status">Checking services...</span>
    </header>

    <main>


        <section class="stats-grid">
    <article class="stat-card">
        <span>Total Tickets</span>
        <strong id="total-count">0</strong>
    </article>

    <article class="stat-card">
        <span>Open</span>
        <strong id="open-count">0</strong>
    </article>

    <article class="stat-card">
        <span>In Progress</span>
        <strong id="progress-count">0</strong>
    </article>

    <article class="stat-card">
        <span>Resolved</span>
        <strong id="resolved-count">0</strong>
    </article>

    <article class="stat-card critical-card">
        <span>Critical</span>
        <strong id="critical-count">0</strong>
    </article>
</section>

        <section class="panel">
            <h2>Create Support Ticket</h2>

            <form id="ticket-form">
                <label for="employee-name">Employee name</label>
                <input id="employee-name" required minlength="2">

                <label for="issue">Issue description</label>
                <textarea id="issue" required minlength="5"></textarea>

                <label for="priority">Priority</label>
                <select id="priority">
                    <option>Low</option>
                    <option selected>Medium</option>
                    <option>High</option>
                    <option>Critical</option>
                </select>

                <button type="submit">Create Ticket</button>
            </form>

            <p id="form-message"></p>
        </section>

        <section class="panel tickets-panel">
           <div class="section-header">
    <h2>Support Tickets</h2>

    <div>
        <input
            id="search-box"
            type="text"
            placeholder="Search tickets..."
        >

        <button
            id="refresh-button"
            type="button">
            Refresh
        </button>
    </div>
</div>
            <p id="data-source"></p>
            <div id="ticket-list"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
